name: Daily short

on:
  schedule:
    # 14:00 UTC daily — adjust to your target audience's peak time
    - cron: "0 14 * * *"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          # Ubuntu's ffmpeg package ships with libass, but fail fast and
          # clearly here instead of deep inside a filter_complex error.
          ffmpeg -filters 2>/dev/null | grep -q subtitles || {
            echo "::error::ffmpeg is missing the subtitles filter (libass)"; exit 1;
          }

      - name: Install dependencies
        run: npm ci

      - name: Run daily pipeline
        env:
          # Every episode is rendered and uploaded to a private preview URL,
          # never auto-published — see the GitHub issue this step creates
          # for the review link and the exact command to publish it.
          SKIP_UPLOAD: "true"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_VOICE_ID_FEMALE: ${{ secrets.ELEVENLABS_VOICE_ID_FEMALE }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: npm run run:daily

      - name: Post episode summary as a GitHub issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f episode-summary.json ]; then
            echo "No summary file found, skipping issue."
            exit 0
          fi
          SKIPPED=$(python3 -c "import json; print(json.load(open('episode-summary.json'))['skipped'])")
          if [ "$SKIPPED" = "True" ]; then
            echo "Run was skipped (no storyline queued), skipping issue."
            exit 0
          fi

          TITLE=$(python3 -c "
          import json
          d = json.load(open('episode-summary.json'))
          ep, total = d.get('episodeNumber'), d.get('totalEpisodes')
          tag = f' — Part {ep}/{total}' if ep else ''
          print(f\"{d['title']}{tag}\")
          ")

          BODY=$(python3 -c "
          import json
          d = json.load(open('episode-summary.json'))
          lines = [f\"**Category:** {d.get('category')}\"]
          if d.get('episodeNumber'):
              lines.append(f\"**Episode:** {d['episodeNumber']} of {d['totalEpisodes']}\")
          lines += ['', d.get('recap', ''), '']
          if d.get('previewUrl'):
              lines.append(f\"**Preview (not published):** {d['previewUrl']}\")
              lines.append('')
              lines.append('Nothing has been posted anywhere yet. To publish this exact episode, run:')
              lines.append(f\"\`{d.get('publishCommand', '')}\`\")
          if d.get('youtubeUrl'):
              lines.append(f\"YouTube: {d['youtubeUrl']}\")
          if d.get('instagramPosted'):
              lines.append('Also posted to Instagram.')
          print(chr(10).join(lines))
          ")

          gh issue create --title "$TITLE" --body "$BODY"

      - name: Commit updated dedupe state
        run: |
          git config user.name "faceless-shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/used-stories.json
          git diff --cached --quiet || git commit -m "chore: record today's published story"
          git push
