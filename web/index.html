<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Submit a storyline</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px 64px;
  }
  h1 { font-size: 1.25rem; }
  label { display: block; font-weight: 600; margin-top: 20px; margin-bottom: 6px; }
  textarea, input {
    width: 100%;
    box-sizing: border-box;
    font-size: 1rem;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #8888;
  }
  textarea { min-height: 120px; resize: vertical; }
  button {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 8px;
    border: none;
    background: #2563eb;
    color: white;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; }
  #status { margin-top: 16px; font-size: 0.95rem; }
  .ok { color: #16a34a; }
  .err { color: #dc2626; }
</style>
</head>
<body>
  <h1>Submit today's storyline</h1>
  <p>One entry becomes the next daily short. If you don't submit one, that day is skipped.</p>

  <form id="form">
    <label for="storyline">Storyline idea</label>
    <textarea id="storyline" required maxlength="600"
      placeholder="e.g. A jewelry heist where the thief falls for the detective chasing them, twist ending"></textarea>

    <label for="secret">Passphrase</label>
    <input id="secret" type="password" required autocomplete="off" />

    <button type="submit">Submit</button>
  </form>

  <div id="status"></div>

  <script>
    const form = document.getElementById("form");
    const statusEl = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const button = form.querySelector("button");
      button.disabled = true;
      statusEl.textContent = "";
      statusEl.className = "";

      try {
        const res = await fetch("/api/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            storyline: document.getElementById("storyline").value,
            secret: document.getElementById("secret").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Submission failed");

        statusEl.textContent = "Queued. It'll be used for the next daily run.";
        statusEl.className = "ok";
        form.reset();
      } catch (err) {
        statusEl.textContent = err.message;
        statusEl.className = "err";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
